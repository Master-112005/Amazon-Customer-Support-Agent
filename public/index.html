<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReplyAgent | Support Intelligence</title>
    <style>
        :root {
            --primary: #232f3e;
            --secondary: #febd69;
            --bg: #f3f3f3;
            --text: #111;
            --border: #ddd;
            --white: #fff;
            --accent: #e47911;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 350px;
            background-color: var(--primary);
            color: var(--white);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary);
        }
        #chat-container {
            flex: 1;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.5;
        }
        .customer {
            align-self: flex-end;
            background-color: var(--secondary);
            color: var(--primary);
            border-bottom-right-radius: 2px;
        }
        .agent {
            align-self: flex-start;
            background-color: #eee;
            color: var(--text);
            border-bottom-left-radius: 2px;
        }
        #input-area {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 16px;
        }
        #send-btn {
            padding: 10px 20px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:hover { background-color: #c4660d; }

        .trace-section {
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 20px;
        }
        .trace-item {
            margin-bottom: 15px;
            font-size: 14px;
        }
        .trace-label {
            font-weight: bold;
            color: var(--secondary);
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 12px;
        }
        .trace-value {
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 4px;
            word-break: break-all;
        }
        .example-box {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            margin-top: 5px;
            border-left: 3px solid var(--secondary);
            font-size: 13px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Agent Trace</h2>
        <p style="font-size: 13px; opacity: 0.8; margin-bottom: 20px;">Real-time internal reasoning for the current request.</p>
        <div id="trace-content">
            <p style="opacity: 0.5; font-style: italic;">Send a message to see the trace...</p>
        </div>
    </div>
    <div id="main">
        <div class="header">
            <h1>📦 ReplyAgent <span style="font-weight: normal; font-size: 16px; opacity: 0.6;">| AmazonHelp AI</span></h1>
        </div>
        <div id="chat-container">
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="user-input" placeholder="Type a customer request..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
